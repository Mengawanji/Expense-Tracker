<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="tracker.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <div class="section">
            <h2>Income</h2>
            <div class="input-group">
                <label for="income-description">Description</label>
                <input type="text" id="income-description" placeholder="e.g Salary">
            </div>
            <div class="input-group">
                <label for="income-amount">Amount $</label>
                <input type="text" id="income-amount" placeholder="e.g $50">
            </div>
            <div class="btn-group">
                <button onclick="addIncome()">Add Income</button>
            </div>
        </div>
        <div class="section">
            <h2>Expense</h2>
            <div class="input-group">
                <label for="expense-description">Description</label>
                <input type="text" id="expense-description" placeholder="e.g Rent">
            </div>
            <div class="input-group">
                <label for="expense-category">Category</label>
                <select name="" id="expense-category">
                    <option value="Housing">Housing</option>
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Others">Others</option>
                </select>
            </div>
            <div class="input-group">
                <label for="expense-amount">Amount $</label>
                <input type="text" id="expense-amount" placeholder="e.g $25">
            </div>
            <div class="btn-group">
                <button onclick="addExpense()">Add Expense</button>
            </div>
        </div>
        <div class="table-container">
            <h2>Transaction History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount $</th>
                        <th>Type</th>
                        <th>Action</th> 
                    </tr>
                </thead>
                <tbody id="transaction-history">

                </tbody>  
            </table>
        </div>
        <div class="summary">
            <h2>Budget Summary</h2>
            <p>Total Income: $ <span id="total-income">0</span></p>
            <p>Total Expenses: $ <span id="total-expenses">0</span></p>
            <p>Balance: $ <span id="balance">0</span></p>
        </div>
        <div class="clear-btn">
            <button onclick="clearAll()">Clear All</button>
        </div>
    </div>    

    


    <script src="tracker.js"></script>
</body>
</html>
