<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="A simple and intuitive expense tracker to manage your income and expenses">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        
        <!-- Income Section -->
        <form id="expense-form" onsubmit="addIncome(event)" class="section">
            <h2>Income</h2>
            <div class="input-group">
                <label for="income-description">Source</label>
                <input type="text" id="income-description" placeholder="e.g. Salary" required>
            </div>
            <div class="input-group">
                <label for="income-amount">Amount </label>
                <input type="number" id="income-amount" placeholder="e.g. 1.000 XAF" required>
            </div>
            <div class="button-group">
                <button onclick="addIncome()"><i class="material-icons">add_box</i>    </button>
            </div>
        </form>

        <!-- Expenses Section -->
        <form id="expense-form" onsubmit="addExpense(event)" class="section">
            <h2>Expenses</h2>
            <div class="input-group">
                <label>Category</label>
                <select id="expense-category">
                    <option value="Housing">Housing & Utilities</option>
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Others">Others</option>
                </select>
            </div>
            <div class="input-group">
                <label>Description</label>
                <input type="text" id="expense-description" placeholder="e.g. Rent">
            </div>
            <div class="input-group">
                <label for="expense-amount">Amount </label>
                <input type="number" id="expense-amount" placeholder="e.g. 500 XAF" required>
            </div>
            <div class="button-group">
                <button onclick="addExpense()"><i class="material-icons">add_box</i></button>
            </div>
        </form>

        <div class="table-container">
            <h2>Transaction History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Description</th>
                        <th>Amount(XAF) </th>
                        <th>Type</th>
                        <th>Action</th> 
                    </tr>
                </thead>
                <tbody id="transaction-history">
                </tbody>
            </table>
        </div>
        <div class="summary">
            <h2>Budget Summary</h2>
            <p>Total Income: <span id="total-income">0</span> XAF</p>
            <p>Total Expenses: <span id="total-expenses">0</span> XAF</p>
            <p>Balance: <span id="balance">0</span> XAF</p>
        </div>
        <div class="clear-button-group">
            <button onclick="clearAll()">Clear All</button>
        </div>
    </div>
    <div id="success-modal" class="modal">
        <div class="modal-content">
            <p>Your transaction has been added successfully.</p>
            <button id="close-btn" class="close-button" onclick="closeModal()">Close</button>
        </div>
    </div>
<script src="./script.js " defer></script>
</body>
</html>
